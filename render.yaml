services:
  - type: web
    name: lumen
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn forgelore.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 180
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: SIM_TIMEOUT
        value: "120"
