{% load static %}
<div class="px-4 h-12 flex items-center border-b border-[#e5e5e5]">
  <a href="/" class="font-display text-base font-semibold text-[#1a1a1a]">Lumen</a>
</div>

<nav class="flex-1 overflow-y-auto py-4 px-3">
  <div class="px-2 mb-2 text-[10px] text-[#6b7280] uppercase tracking-widest font-medium">Research</div>
  <ul class="space-y-0.5">
    <li>
      <a href="/dashboard/" class="flex items-center rounded-md px-2 py-1.5 text-sm {% if request.path == '/dashboard/' %}font-medium text-[#1a1a1a] bg-[#f0efec]{% else %}text-[#6b7280] hover:bg-[#f0efec] hover:text-[#1a1a1a]{% endif %} transition-colors">
        Overview
      </a>
    </li>
    <li>
      <a href="{% url 'projects_list' %}" class="flex items-center rounded-md px-2 py-1.5 text-sm {% if '/projects' in request.path %}font-medium text-[#1a1a1a] bg-[#f0efec]{% else %}text-[#6b7280] hover:bg-[#f0efec] hover:text-[#1a1a1a]{% endif %} transition-colors">
        Projects
      </a>
    </li>
    <li>
      <a href="{% url 'literature_search' %}" class="flex items-center rounded-md px-2 py-1.5 text-sm {% if '/literature' in request.path %}font-medium text-[#1a1a1a] bg-[#f0efec]{% else %}text-[#6b7280] hover:bg-[#f0efec] hover:text-[#1a1a1a]{% endif %} transition-colors">
        Literature
      </a>
    </li>
    <li>
      <a href="{% url 'experiments_list' %}" class="flex items-center rounded-md px-2 py-1.5 text-sm {% if '/experiments' in request.path %}font-medium text-[#1a1a1a] bg-[#f0efec]{% else %}text-[#6b7280] hover:bg-[#f0efec] hover:text-[#1a1a1a]{% endif %} transition-colors">
        Experiments
      </a>
    </li>
  </ul>

  <div class="my-4 mx-2">
    <div class="h-px bg-[#e5e5e5]"></div>
  </div>

  <div class="px-2 mb-2 text-[10px] text-[#6b7280] uppercase tracking-widest font-medium">Account</div>
  <ul class="space-y-0.5">
    <li>
      <a href="{% url 'settings' %}" class="flex items-center rounded-md px-2 py-1.5 text-sm {% if '/settings' in request.path %}font-medium text-[#1a1a1a] bg-[#f0efec]{% else %}text-[#6b7280] hover:bg-[#f0efec] hover:text-[#1a1a1a]{% endif %} transition-colors">
        Settings
      </a>
    </li>
  </ul>
</nav>

<div class="border-t border-[#e5e5e5] px-4 py-3">
  <div class="flex items-center justify-between">
    <span class="text-xs text-[#6b7280] truncate">{{ user.email|default:user.username }}</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="text-xs text-[#6b7280] hover:text-[#1a1a1a] transition">
        Sign out
      </button>
    </form>
  </div>
</div>
