{% extends "landing.html" %}

{% block title %}Sign in — Lumen{% endblock %}

{% block content %}
<section class="flex-1 flex items-center justify-center py-20">
  <div class="w-full max-w-[340px] px-6">
    <div class="mb-8">
      <h1 class="text-[18px] font-serif font-semibold text-[#2d2a26]">Sign in to Lumen</h1>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% if form.non_field_errors %}
      <div class="border-l-2 border-[#eb5757] bg-[#f7f6f3] px-3 py-2 text-[13px] text-[#37352f]">
        {{ form.non_field_errors }}
      </div>
      {% endif %}

      <div>
        <label for="id_username" class="block text-[13px] text-[#787774] mb-1">Username</label>
        <input type="text" name="username" id="id_username" required autofocus class="w-full rounded border border-[#e3e2de] bg-white px-3 py-2 text-[14px] text-[#37352f] placeholder:text-[#787774] focus:border-[#8b6834] focus:ring-1 focus:ring-[#8b6834]/20 focus:outline-none transition">
      </div>
      <div>
        <label for="id_password" class="block text-[13px] text-[#787774] mb-1">Password</label>
        <input type="password" name="password" id="id_password" required class="w-full rounded border border-[#e3e2de] bg-white px-3 py-2 text-[14px] text-[#37352f] placeholder:text-[#787774] focus:border-[#8b6834] focus:ring-1 focus:ring-[#8b6834]/20 focus:outline-none transition">
      </div>

      <button type="submit" class="w-full rounded bg-[#8b6834] px-3 py-2 text-[14px] font-medium text-white hover:bg-[#7a5a2d] transition">Sign in</button>
    </form>

    <p class="mt-6 text-[13px] text-[#787774]">
      No account? <a href="/signup/" class="text-[#8b6834] hover:underline">Create one</a>
    </p>
  </div>
</section>
{% endblock %}
